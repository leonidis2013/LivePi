name: compat

# Runs the latest released LivePi build in clean Debian containers (ARM64) with no sound card.
# Runs after every build has finished (and published its release), so it always tests the newest one.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm, debian:trixie]
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern 'livepi-build-*.zip' --repo "$GITHUB_REPOSITORY"
      - name: Run in ${{ matrix.image }}
        run: |
          set +e
          docker run --rm -v "$PWD:/work" ${{ matrix.image }} bash /work/scripts/ci-smoke.sh > smoke.log 2>&1
          rc=$?
          echo "exit code $rc"
          # One annotation per block (GitHub shows at most 10 per step); %0A is a line break
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-300 | awk 'BEGIN{ORS="%0A"}{print}'; }
          echo "::notice title=${{ matrix.image }} failures::$( (grep '^FAIL' result.txt || echo none) | enc)"
          echo "::notice title=${{ matrix.image }} results::$(enc < result.txt)"
          echo "::notice title=${{ matrix.image }} log::$(tail -n 25 smoke.log | enc)"
          grep -q "ALL PASSED" result.txt || { echo "::error::${{ matrix.image }} smoke test failed"; exit 1; }
