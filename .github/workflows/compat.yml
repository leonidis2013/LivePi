name: compat

# Runs the newest LivePi build in clean Debian containers (ARM64) with no sound card.
# Runs after every build, on that exact build (released or not), so nothing is released untested twice.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Test the build from this build run instead of the latest release"
        required: false
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm, debian:trixie]
    steps:
      - uses: actions/checkout@v4
      - name: Get the package (the build that just finished, or the latest release)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'livepi-build-*' --dir art
            find art -name 'livepi-build-*.zip' -exec mv {} . \;
          else
            gh release download --pattern 'livepi-build-*.zip' --repo "$GITHUB_REPOSITORY"
          fi
          ls -l livepi-build-*.zip
      - name: Run in ${{ matrix.image }}
        run: |
          set +e
          docker run --rm -v "$PWD:/work" ${{ matrix.image }} bash /work/scripts/ci-smoke.sh > smoke.log 2>&1
          rc=$?
          echo "exit code $rc"
          # One annotation per block (GitHub shows at most 10 per step); %0A is a line break
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-300 | awk 'BEGIN{ORS="%0A"}{print}'; }
          echo "::notice title=${{ matrix.image }} failures::$( (grep '^FAIL' result.txt || echo none) | enc)"
          echo "::notice title=${{ matrix.image }} results::$(enc < result.txt)"
          echo "::notice title=${{ matrix.image }} log::$(tail -n 25 smoke.log | enc)"
          grep -q "ALL PASSED" result.txt || { echo "::error::${{ matrix.image }} smoke test failed"; exit 1; }
