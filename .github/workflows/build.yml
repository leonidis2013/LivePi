name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish a Release with the update zip

jobs:
  linux-arm64:
    # 22.04 so the binary runs on Raspberry Pi OS Bookworm (older glibc) as well as newer
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config zip ccache \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libgl1-mesa-dev

      # Compiler cache: JUCE itself rarely changes, so most builds only recompile LivePi's own files
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-arm64-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-arm64-${{ hashFiles('CMakeLists.txt') }}-
            ccache-${{ runner.os }}-arm64-

      - name: Configure
        env:
          CCACHE_MAXSIZE: 600M
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIVEPI_BUILD=${{ github.run_number }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        env:
          CCACHE_MAXSIZE: 600M
        run: |
          set +e
          cmake --build build -- -k 0 > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # Show the first errors as annotations so they are visible on the run summary page
            grep -E "error:|undefined reference|ld returned|FAILED:" build.log | head -10 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-450)"
            done
            tail -60 build.log
          fi
          ccache -s | head -5 || true
          exit $rc

      - name: Package
        run: |
          BIN=$(find build -name LivePi -type f -perm -u+x | head -n1)
          D=dist/livepi
          mkdir -p $D
          cp "$BIN" $D/LivePi
          cp -r web $D/web
          cp scripts/install-pi.sh scripts/set-password.sh scripts/trusted-network.sh scripts/run.sh scripts/livepi-os scripts/livepi-os-job INSTALLER_LEVEL $D/
          chmod +x $D/install-pi.sh $D/set-password.sh $D/trusted-network.sh $D/run.sh $D/livepi-os $D/livepi-os-job $D/LivePi
          echo "version ${{ github.run_number }} (${GITHUB_SHA::7})" > $D/VERSION
          printf '{ "build": "%s", "installerLevel": %s, "sha256": "%s" }\n' \
            "${{ github.run_number }}" "$(tr -d '[:space:]' < INSTALLER_LEVEL)" "$(sha256sum $D/LivePi | cut -d' ' -f1)" > $D/manifest.json
          # One package for both uses: upload it on the Setup tab to update, or unzip it for a fresh install
          (cd dist && zip -qr ../livepi-build-${{ github.run_number }}.zip livepi)
          tar czf livepi-linux-arm64.tar.gz -C dist livepi
          ls -la *.zip *.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: livepi-build-${{ github.run_number }}
          path: |
            livepi-build-${{ github.run_number }}.zip
            livepi-linux-arm64.tar.gz

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "livepi-build-${{ github.run_number }}.zip" livepi-linux-arm64.tar.gz \
            --title "LivePi version ${{ github.run_number }}" \
            --notes "Update an installed Pi: upload livepi-build-${{ github.run_number }}.zip on the Setup tab. Fresh install: unzip it and run sudo ./install-pi.sh." \
            --target "${{ github.sha }}"
